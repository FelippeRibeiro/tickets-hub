services:
  app:
    build: .
    container_name: ticket-app
    volumes:
      - ./.env:/app/.env
      - ./data/uploads:/app/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      app-network:
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: ticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      app-network:

networks:
  app-network:

volumes:
  pgdata:
